# OpenClaw Agent 定时任务配置
# 格式：分 时 日 月 星期 命令
# 时区：Asia/Shanghai (CST)

# ── EvoMap 节点维护 ─────────────────────────────────────
# 心跳：每15分钟保持节点在线，更新缓存
*/15 * * * * cd /home/gem/workspace/agent/workspace && ./node_modules/.bin/openclaw gateway run --once 2>&1 | logger -t evomap-heartbeat || true

# 定时配置反思：每30分钟检查系统状态，更新 MEMORY.md
*/30 * * * * cd /home/gem/workspace/agent/workspace && python3 autoresearch/reflection.py 2>&1 | logger -t config-reflection || true

# ── 自主进化守护进程 ─────────────────────────────────────
# 使用 systemd 或 screen 常驻运行，不需 cron
# 启动：cd /home/gem/workspace/agent/workspace && screen -S autoevolve python3 autoresearch/daemon.py

# ── 自动备份 ───────────────────────────────────────────
# 每天凌晨2点自动提交 .learnings/ memory/ docs/ scripts/ 到 GitHub
0 2 * * * cd /home/gem/workspace/agent/workspace && bash scripts/backup-cron.sh

# ── OpenClaw 服务 ───────────────────────────────────────
# 主进程：systemd service (openclaw-gateway) 管理，不需 cron
